$kind: collection
description: |-
  Complete API collection for the NEPSE AI Platform.  
  Covers three FastAPI services:

  - Dashboard API (port 8766) — read-only dashboard, reporter, settings, NRB data, stealth signals
      
  - NRB Entry API (port 8765) — standalone NRB monthly data entry
      
  - Trading API (port 8767) — paper-trading service (service-to-service, X-Service-Key auth)
