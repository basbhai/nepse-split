<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credentials — NEPSE Trading</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d0f0e;
    --surface:   #141714;
    --surface2:  #1a1d1a;
    --border:    #2a2e2a;
    --border2:   #353a35;
    --green:     #4ade80;
    --green-dim: #22c55e44;
    --amber:     #fbbf24;
    --red:       #f87171;
    --blue:      #60a5fa;
    --text:      #e2e8e2;
    --text-dim:  #6b7a6b;
    --text-mid:  #9aaa9a;
    --mono:      'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.5; }

  .header {
    border-bottom: 1px solid var(--border); padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .header-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
  .header-title { font-size: 12px; letter-spacing: .15em; color: var(--text-mid); text-transform: uppercase; }
  .header-title span { color: var(--green); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .logout-btn { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
                padding: 6px 14px; border-radius: 3px; border: 1px solid var(--border); cursor: pointer;
                background: transparent; color: var(--text-dim); transition: all .15s; }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .page { max-width: 860px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 32px; }

  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
  .section-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; justify-content: space-between;
  }
  .section-title { font-size: 10px; letter-spacing: .12em; color: var(--text-dim); text-transform: uppercase;
                   display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; display: inline-block; width: 3px; height: 12px; background: var(--green); }
  .add-btn { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
             padding: 5px 14px; border-radius: 3px; border: 1px solid var(--green); cursor: pointer;
             background: transparent; color: var(--green); transition: all .15s; }
  .add-btn:hover { background: var(--green-dim); }

  .items-list { display: flex; flex-direction: column; }
  .item-row {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .item-name { font-size: 13px; color: var(--text); }
  .item-meta { font-size: 11px; color: var(--text-dim); }
  .item-actions { display: flex; gap: 8px; }
  .action-btn { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
                padding: 4px 12px; border-radius: 3px; border: 1px solid var(--border); cursor: pointer;
                background: transparent; color: var(--text-dim); transition: all .15s; }
  .action-btn:hover { border-color: var(--text-mid); color: var(--text); }
  .action-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .badge { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; }
  .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid #4ade8033; }
  .badge-dim { background: #ffffff08; color: var(--text-dim); border: 1px solid var(--border); }

  .empty-state { padding: 24px 20px; color: var(--text-dim); font-size: 12px; text-align: center; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: #000000cc;
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
           width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 14px 20px; border-bottom: 1px solid var(--border);
                  display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 10px; letter-spacing: .12em; color: var(--text-dim); text-transform: uppercase; }
  .modal-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

  .field-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 10px; letter-spacing: .1em; color: var(--text-dim); text-transform: uppercase; }
  input, select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 7px 11px; border-radius: 3px; outline: none;
    transition: border-color .15s; width: 100%;
  }
  input:focus, select:focus { border-color: var(--green); }
  .helper { font-size: 11px; color: var(--text-dim); }

  .btn { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
         padding: 8px 20px; border-radius: 3px; border: 1px solid; cursor: pointer; transition: all .15s; }
  .btn-green { background: transparent; border-color: var(--green); color: var(--green); }
  .btn-green:hover { background: var(--green-dim); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  .status-banner { font-size: 12px; padding: 8px 12px; border-radius: 3px; display: none;
                   align-items: center; gap: 8px; line-height: 1.4; }
  .status-banner.success { display: flex; background: #4ade8018; border: 1px solid #4ade8044; color: var(--green); }
  .status-banner.error   { display: flex; background: #f8717118; border: 1px solid #f8717144; color: var(--red); }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 1px solid currentColor;
             border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .links-section { padding: 8px 20px 12px; border-top: 1px solid var(--border); background: var(--surface2); }
  .links-title { font-size: 10px; letter-spacing: .1em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
  .link-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .link-row:last-child { border-bottom: none; }
  .link-label { flex: 1; font-size: 12px; color: var(--text-mid); }
  .link-url { flex: 2; font-size: 11px; color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-type { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); padding: 2px 7px; border: 1px solid var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-dot"></div>
  <div class="header-title">NEPSE AI / <span>Credentials</span></div>
  <div class="header-right">
    <button class="logout-btn" onclick="doLogout()">Log out</button>
  </div>
</div>

<div class="page">

  <!-- Meroshare Accounts -->
  <div class="section" id="msSection">
    <div class="section-header">
      <div class="section-title">Meroshare Accounts</div>
      <button class="add-btn" onclick="openMSModal()">+ Add</button>
    </div>
    <div class="items-list" id="msList">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

  <!-- Broker Accounts -->
  <div class="section" id="brokerSection">
    <div class="section-header">
      <div class="section-title">Broker / TMS Accounts</div>
      <button class="add-btn" onclick="openBrokerModal()">+ Add</button>
    </div>
    <div class="items-list" id="brokerList">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

</div>

<!-- Meroshare Modal -->
<div class="modal-overlay" id="msModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="msModalTitle">Add Meroshare Account</span>
      <button class="modal-close" onclick="closeModal('msModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="status-banner" id="msStatus"></div>
      <div class="field-group">
        <label>Label (optional)</label>
        <input type="text" id="ms_label" placeholder="e.g. My Meroshare">
      </div>
      <div class="field-group">
        <label>DP ID <span style="color:var(--red)">*</span></label>
        <input type="text" id="ms_dp_id" placeholder="e.g. 13200123456">
      </div>
      <div class="field-group">
        <label>Demat Number <span style="color:var(--red)">*</span></label>
        <input type="text" id="ms_demat" placeholder="e.g. 1301370123456789">
      </div>
      <div class="field-group">
        <label>Client Code <span style="color:var(--red)">*</span></label>
        <input type="text" id="ms_client_code" placeholder="e.g. AB123456">
      </div>
      <div class="field-group">
        <label>Username <span style="color:var(--red)">*</span></label>
        <input type="text" id="ms_username" placeholder="Meroshare username">
      </div>
      <div class="field-group">
        <label id="ms_pw_label">Password <span style="color:var(--red)">*</span></label>
        <input type="password" id="ms_password" placeholder="Leave blank to keep existing">
        <span class="helper" id="ms_pw_help"></span>
      </div>
      <div class="field-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="ms_primary" style="width:auto">
        <label for="ms_primary" style="text-transform:none;font-size:12px">Set as primary</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('msModal')">Cancel</button>
      <button class="btn btn-green" onclick="submitMS()">Save</button>
    </div>
  </div>
</div>

<!-- Broker Modal -->
<div class="modal-overlay" id="brokerModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="brokerModalTitle">Add Broker Account</span>
      <button class="modal-close" onclick="closeModal('brokerModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="status-banner" id="brokerStatus"></div>
      <div class="field-group">
        <label>Label (optional)</label>
        <input type="text" id="br_label" placeholder="e.g. My Broker">
      </div>
      <div class="field-group">
        <label>Broker Name <span style="color:var(--red)">*</span></label>
        <input type="text" id="br_name" placeholder="e.g. Sunrise Capital">
      </div>
      <div class="field-group">
        <label>Broker Code <span style="color:var(--red)">*</span></label>
        <input type="text" id="br_code" placeholder="e.g. 57">
      </div>
      <div class="field-group">
        <label>TMS Base URL <span style="color:var(--red)">*</span></label>
        <input type="text" id="br_url" placeholder="e.g. https://tms57.nepsetms.com.np">
      </div>
      <div class="field-group">
        <label>Username <span style="color:var(--red)">*</span></label>
        <input type="text" id="br_username" placeholder="TMS username">
      </div>
      <div class="field-group">
        <label id="br_pw_label">Password <span style="color:var(--red)">*</span></label>
        <input type="password" id="br_password" placeholder="Leave blank to keep existing">
      </div>
      <div class="field-group">
        <label>Account Type</label>
        <select id="br_account_type">
          <option value="both">Both (Buy + Sell)</option>
          <option value="buy">Buy only</option>
          <option value="sell">Sell only</option>
        </select>
      </div>
      <div class="field-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="br_primary" style="width:auto">
        <label for="br_primary" style="text-transform:none;font-size:12px">Set as primary</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('brokerModal')">Cancel</button>
      <button class="btn btn-green" onclick="submitBroker()">Save</button>
    </div>
  </div>
</div>

<!-- Broker Link Modal -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Add Broker Link</span>
      <button class="modal-close" onclick="closeModal('linkModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="status-banner" id="linkStatus"></div>
      <div class="field-group">
        <label>Link Type</label>
        <select id="lk_type">
          <option value="tms">TMS Web</option>
          <option value="app">Mobile App</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field-group">
        <label>Label <span style="color:var(--red)">*</span></label>
        <input type="text" id="lk_label" placeholder="e.g. TMS Login">
      </div>
      <div class="field-group">
        <label>URL <span style="color:var(--red)">*</span></label>
        <input type="text" id="lk_url" placeholder="https://...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('linkModal')">Cancel</button>
      <button class="btn btn-green" onclick="submitLink()">Add</button>
    </div>
  </div>
</div>

<script>
let _data = { meroshare: [], brokers: [], links: [] };
let _editingMsId = null;
let _editingBrokerId = null;
let _addLinkBrokerId = null;

async function loadData() {
  try {
    const r = await fetch('/api/credentials/data');
    if (r.status === 401) { window.location.href = '/user-login'; return; }
    _data = await r.json();
    renderMeroshare();
    renderBrokers();
  } catch(e) {
    console.error('loadData:', e);
  }
}

function renderMeroshare() {
  const el = document.getElementById('msList');
  if (!_data.meroshare.length) {
    el.innerHTML = '<div class="empty-state">No Meroshare accounts — click + Add to set one up.</div>';
    return;
  }
  el.innerHTML = _data.meroshare.map(ms => `
    <div class="item-row">
      <div class="item-info">
        <div class="item-name">${ms.label || ms.username} ${ms.is_primary==='true'?'<span class="badge badge-green">primary</span>':''}</div>
        <div class="item-meta">DP: ${ms.dp_id} · Demat: ${ms.demat_number} · Client: ${ms.client_code}</div>
      </div>
      <div class="item-actions">
        <button class="action-btn" onclick="editMS(${ms.id})">Edit</button>
        <button class="action-btn danger" onclick="deleteMS(${ms.id})">Delete</button>
      </div>
    </div>
  `).join('');
}

function renderBrokers() {
  const el = document.getElementById('brokerList');
  if (!_data.brokers.length) {
    el.innerHTML = '<div class="empty-state">No broker accounts — click + Add to set one up.</div>';
    return;
  }
  el.innerHTML = _data.brokers.map(br => {
    const brokerLinks = _data.links.filter(l => String(l.broker_id) === String(br.id));
    const linksHtml = brokerLinks.length ? `
      <div class="links-section">
        <div class="links-title">Links</div>
        ${brokerLinks.map(l => `
          <div class="link-row">
            <span class="link-type">${l.link_type}</span>
            <span class="link-label">${l.label}</span>
            <a class="link-url" href="${l.url}" target="_blank">${l.url}</a>
            <button class="action-btn danger" style="padding:2px 8px;font-size:9px" onclick="deleteLink(${br.id},${l.id})">×</button>
          </div>
        `).join('')}
      </div>` : '';
    return `
      <div>
        <div class="item-row">
          <div class="item-info">
            <div class="item-name">${br.label || br.broker_name} ${br.is_primary==='true'?'<span class="badge badge-green">primary</span>':''}</div>
            <div class="item-meta">${br.broker_name} · Code: ${br.broker_code} · ${br.username} · ${br.account_type}</div>
          </div>
          <div class="item-actions">
            <button class="action-btn" onclick="openLinkModal(${br.id})">+ Link</button>
            <button class="action-btn" onclick="editBroker(${br.id})">Edit</button>
            <button class="action-btn danger" onclick="deleteBroker(${br.id})">Delete</button>
          </div>
        </div>
        ${linksHtml}
      </div>`;
  }).join('');
}

function openMSModal(id) {
  _editingMsId = id || null;
  document.getElementById('msModalTitle').textContent = id ? 'Edit Meroshare Account' : 'Add Meroshare Account';
  const ms = id ? _data.meroshare.find(m => m.id === id) : null;
  document.getElementById('ms_label').value       = ms?.label || '';
  document.getElementById('ms_dp_id').value       = ms?.dp_id || '';
  document.getElementById('ms_demat').value       = ms?.demat_number || '';
  document.getElementById('ms_client_code').value = ms?.client_code || '';
  document.getElementById('ms_username').value    = ms?.username || '';
  document.getElementById('ms_password').value    = '';
  document.getElementById('ms_primary').checked   = ms?.is_primary === 'true';
  document.getElementById('ms_pw_help').textContent = ms ? 'Leave blank to keep existing password' : '';
  document.getElementById('ms_pw_label').innerHTML = ms
    ? 'Password' : 'Password <span style="color:var(--red)">*</span>';
  document.getElementById('msStatus').className = 'status-banner';
  document.getElementById('msModal').classList.add('open');
}

function editMS(id) { openMSModal(id); }

function openBrokerModal(id) {
  _editingBrokerId = id || null;
  document.getElementById('brokerModalTitle').textContent = id ? 'Edit Broker Account' : 'Add Broker Account';
  const br = id ? _data.brokers.find(b => b.id === id) : null;
  document.getElementById('br_label').value        = br?.label || '';
  document.getElementById('br_name').value         = br?.broker_name || '';
  document.getElementById('br_code').value         = br?.broker_code || '';
  document.getElementById('br_url').value          = br?.tms_base_url || '';
  document.getElementById('br_username').value     = br?.username || '';
  document.getElementById('br_password').value     = '';
  document.getElementById('br_account_type').value = br?.account_type || 'both';
  document.getElementById('br_primary').checked    = br?.is_primary === 'true';
  document.getElementById('brokerStatus').className = 'status-banner';
  document.getElementById('brokerModal').classList.add('open');
}

function editBroker(id) { openBrokerModal(id); }

function openLinkModal(brokerId) {
  _addLinkBrokerId = brokerId;
  document.getElementById('lk_label').value = '';
  document.getElementById('lk_url').value   = '';
  document.getElementById('lk_type').value  = 'tms';
  document.getElementById('linkStatus').className = 'status-banner';
  document.getElementById('linkModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showStatus(elId, type, msg) {
  const el = document.getElementById(elId);
  el.className = `status-banner ${type}`;
  el.innerHTML = msg;
}

async function submitMS() {
  const payload = {
    label:        document.getElementById('ms_label').value.trim() || null,
    dp_id:        document.getElementById('ms_dp_id').value.trim(),
    demat_number: document.getElementById('ms_demat').value.trim(),
    client_code:  document.getElementById('ms_client_code').value.trim(),
    username:     document.getElementById('ms_username').value.trim(),
    password:     document.getElementById('ms_password').value || null,
    is_primary:   document.getElementById('ms_primary').checked,
  };
  if (!payload.dp_id || !payload.demat_number || !payload.client_code || !payload.username) {
    showStatus('msStatus', 'error', 'Required fields missing.'); return;
  }
  showStatus('msStatus', '', '<span class="spinner"></span> Saving...');
  try {
    const r = await fetch('/credentials/meroshare', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (r.ok) { closeModal('msModal'); await loadData(); }
    else showStatus('msStatus', 'error', d.detail || 'Failed');
  } catch(e) { showStatus('msStatus', 'error', e.message); }
}

async function submitBroker() {
  const payload = {
    label:        document.getElementById('br_label').value.trim() || null,
    broker_name:  document.getElementById('br_name').value.trim(),
    broker_code:  document.getElementById('br_code').value.trim(),
    tms_base_url: document.getElementById('br_url').value.trim(),
    username:     document.getElementById('br_username').value.trim(),
    password:     document.getElementById('br_password').value || null,
    account_type: document.getElementById('br_account_type').value,
    is_primary:   document.getElementById('br_primary').checked,
  };
  if (!payload.broker_name || !payload.broker_code || !payload.tms_base_url || !payload.username) {
    showStatus('brokerStatus', 'error', 'Required fields missing.'); return;
  }
  showStatus('brokerStatus', '', '<span class="spinner"></span> Saving...');
  try {
    const r = await fetch('/credentials/broker', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (r.ok) { closeModal('brokerModal'); await loadData(); }
    else showStatus('brokerStatus', 'error', d.detail || 'Failed');
  } catch(e) { showStatus('brokerStatus', 'error', e.message); }
}

async function submitLink() {
  const payload = {
    link_type: document.getElementById('lk_type').value,
    label:     document.getElementById('lk_label').value.trim(),
    url:       document.getElementById('lk_url').value.trim(),
  };
  if (!payload.label || !payload.url) {
    showStatus('linkStatus', 'error', 'Label and URL required.'); return;
  }
  showStatus('linkStatus', '', '<span class="spinner"></span> Adding...');
  try {
    const r = await fetch(`/credentials/broker/${_addLinkBrokerId}/links`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (r.ok) { closeModal('linkModal'); await loadData(); }
    else showStatus('linkStatus', 'error', d.detail || 'Failed');
  } catch(e) { showStatus('linkStatus', 'error', e.message); }
}

async function deleteMS(id) {
  if (!confirm('Delete this Meroshare account?')) return;
  const r = await fetch(`/credentials/meroshare/${id}`, { method: 'DELETE' });
  if (r.ok) loadData();
  else alert('Delete failed');
}

async function deleteBroker(id) {
  if (!confirm('Delete this broker and all its links?')) return;
  const r = await fetch(`/credentials/broker/${id}`, { method: 'DELETE' });
  if (r.ok) loadData();
  else alert('Delete failed');
}

async function deleteLink(brokerId, linkId) {
  if (!confirm('Remove this link?')) return;
  const r = await fetch(`/credentials/broker/${brokerId}/links/${linkId}`, { method: 'DELETE' });
  if (r.ok) loadData();
  else alert('Delete failed');
}

async function doLogout() {
  await fetch('/user-logout', { method: 'POST' });
  window.location.href = '/user-login';
}

loadData();
</script>
