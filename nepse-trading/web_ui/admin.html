<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — NEPSE Trading</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f0e; --surface:#141714; --surface2:#1a1d1a; --border:#2a2e2a;
    --green:#4ade80; --green-dim:#22c55e44; --amber:#fbbf24; --red:#f87171;
    --blue:#60a5fa; --text:#e2e8e2; --text-dim:#6b7a6b; --text-mid:#9aaa9a;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.5}

  .header{border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;
          gap:16px;position:sticky;top:0;background:var(--bg);z-index:100}
  .header-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
               box-shadow:0 0 8px var(--amber);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .header-title{font-size:12px;letter-spacing:.15em;color:var(--text-mid);text-transform:uppercase}
  .header-title span{color:var(--amber)}
  .refresh-btn{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
               text-transform:uppercase;padding:6px 14px;border-radius:3px;
               border:1px solid var(--border);cursor:pointer;background:transparent;
               color:var(--text-dim);transition:all .15s}
  .refresh-btn:hover{border-color:var(--text-mid);color:var(--text)}

  .page{max-width:1000px;margin:0 auto;padding:32px 24px;display:flex;flex-direction:column;gap:32px}

  .section{background:var(--surface);border:1px solid var(--border);border-radius:4px}
  .section-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .section-title{font-size:10px;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;
                 display:flex;align-items:center;gap:8px}
  .section-title::before{content:'';display:inline-block;width:3px;height:12px;background:var(--amber)}
  .count-badge{font-size:9px;letter-spacing:.06em;padding:2px 8px;border-radius:2px;
               background:#fbbf2420;border:1px solid #fbbf2440;color:var(--amber)}

  table{width:100%;border-collapse:collapse}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);
     padding:8px 14px;border-bottom:1px solid var(--border);text-align:left;font-weight:400}
  td{font-size:12px;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text-mid);
     vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#ffffff04}

  .badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
  .badge-pending{background:#fbbf2420;border:1px solid #fbbf2440;color:var(--amber)}
  .badge-approved{background:#4ade8020;border:1px solid #4ade8040;color:var(--green)}
  .badge-blocked{background:#f8717120;border:1px solid #f8717140;color:var(--red)}

  .channel-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text-dim);
               padding:2px 6px;border:1px solid var(--border);border-radius:2px;margin:1px}

  .approve-btn,.deny-btn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
                         padding:4px 10px;border-radius:3px;border:1px solid;cursor:pointer;
                         background:transparent;transition:all .15s}
  .approve-btn{border-color:var(--green);color:var(--green)}
  .approve-btn:hover{background:var(--green-dim)}
  .deny-btn{border-color:var(--border);color:var(--text-dim);margin-left:6px}
  .deny-btn:hover{border-color:var(--red);color:var(--red)}

  .empty-state{padding:24px 20px;color:var(--text-dim);font-size:12px;text-align:center}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);
         border-radius:4px;padding:10px 16px;font-size:12px;z-index:500;display:none;
         box-shadow:0 4px 16px #0005}
  .toast.show{display:block}
  .toast.success{border-color:#4ade8044;color:var(--green)}
  .toast.error{border-color:#f8717144;color:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-dot"></div>
  <div class="header-title">NEPSE AI / <span>Admin</span></div>
  <button class="refresh-btn" onclick="loadData()">Refresh</button>
</div>

<div class="page">

  <!-- Pending approvals -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Pending Approvals</div>
      <span class="count-badge" id="pendingCount">0</span>
    </div>
    <div id="pendingTable">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

  <!-- All users -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">All Users</div>
      <span class="count-badge" id="allCount" style="background:#60a5fa20;border-color:#60a5fa40;color:var(--blue)">0</span>
    </div>
    <div id="allUsersTable">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let _pending = [];
let _users   = [];

function groupByUser(rows) {
  const byUser = {};
  for (const r of rows) {
    if (!byUser[r.id]) {
      byUser[r.id] = { id: r.id, full_name: r.full_name, status: r.status,
                       created_at: r.created_at, approved_at: r.approved_at, channels: [] };
    }
    if (r.platform) {
      byUser[r.id].channels.push({ platform: r.platform, platform_user_id: r.platform_user_id, username: r.username });
    }
  }
  return Object.values(byUser);
}

function statusBadge(s) {
  const cls = s === 'APPROVED' ? 'approved' : s === 'PENDING' ? 'pending' : 'blocked';
  return `<span class="badge badge-${cls}">${s}</span>`;
}

function channelTags(channels) {
  if (!channels.length) return '<span style="color:var(--text-dim);font-size:11px">—</span>';
  return channels.map(c =>
    `<span class="channel-tag">${c.platform} · ${c.platform_user_id}${c.username ? ' · @'+c.username : ''}</span>`
  ).join('');
}

function renderPending(users) {
  document.getElementById('pendingCount').textContent = users.length;
  if (!users.length) {
    document.getElementById('pendingTable').innerHTML = '<div class="empty-state">No pending registrations.</div>';
    return;
  }
  document.getElementById('pendingTable').innerHTML = `
    <table>
      <thead><tr>
        <th>Name</th><th>Channels</th><th>Registered</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${users.map(u => `
          <tr>
            <td>${u.full_name}</td>
            <td>${channelTags(u.channels)}</td>
            <td style="color:var(--text-dim);font-size:11px">${u.created_at || '—'}</td>
            <td>
              <button class="approve-btn" onclick="doApprove(${u.id},'${u.full_name}')">Approve</button>
              <button class="deny-btn"    onclick="doDeny(${u.id},'${u.full_name}')">Deny</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function renderAllUsers(users) {
  document.getElementById('allCount').textContent = users.length;
  if (!users.length) {
    document.getElementById('allUsersTable').innerHTML = '<div class="empty-state">No users found.</div>';
    return;
  }
  document.getElementById('allUsersTable').innerHTML = `
    <table>
      <thead><tr>
        <th>ID</th><th>Name</th><th>Status</th><th>Channels</th><th>Approved</th>
      </tr></thead>
      <tbody>
        ${users.map(u => `
          <tr>
            <td style="color:var(--text-dim)">${u.id}</td>
            <td>${u.full_name}</td>
            <td>${statusBadge(u.status)}</td>
            <td>${channelTags(u.channels)}</td>
            <td style="color:var(--text-dim);font-size:11px">${u.approved_at || '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

async function loadData() {
  try {
    const r = await fetch('/api/admin/data');
    if (r.status === 401) { window.location.href = 'http://localhost:8766/login'; return; }
    const d = await r.json();
    _pending = groupByUser(d.pending);
    _users   = groupByUser(d.users);
    renderPending(_pending);
    renderAllUsers(_users);
  } catch(e) {
    console.error('loadData:', e);
  }
}

async function doApprove(userId, name) {
  if (!confirm(`Approve ${name}?`)) return;
  const r = await fetch(`/admin/approve/${userId}`, { method: 'POST' });
  if (r.ok) { toast(`Approved: ${name}`, 'success'); await loadData(); }
  else { const d = await r.json().catch(()=>({})); toast(d.detail || 'Failed', 'error'); }
}

async function doDeny(userId, name) {
  if (!confirm(`Deny ${name}? This will block their access.`)) return;
  const r = await fetch(`/admin/deny/${userId}`, { method: 'POST' });
  if (r.ok) { toast(`Denied: ${name}`, 'success'); await loadData(); }
  else { const d = await r.json().catch(()=>({})); toast(d.detail || 'Failed', 'error'); }
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.className = 'toast', 3000);
}

loadData();
</script>
</body>
</html>
